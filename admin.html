<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理單字</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">管理單字</h1>
        <form id="wordForm">
            <div class="form-group">
                <label for="word">英文單字：</label>
                <input type="text" id="word" required>
            </div>
            <div class="form-group">
                <label for="translation">翻譯：</label>
                <input type="text" id="translation" required>
            </div>
            <div class="form-group">
                <label for="partOfSpeech">詞性：</label>
                <input type="text" id="partOfSpeech" required>
            </div>
            <div class="form-group">
                <label for="example">例句：</label>
                <textarea id="example" required></textarea>
            </div>
            <div class="form-group">
                <label for="rootAnalysis">字根分析：</label>
                <textarea id="rootAnalysis" required></textarea>
            </div>
            <button type="submit" class="submit-btn">新增單字</button>
            <button type="button" id="searchButton" class="submit-btn secondary">搜尋相關內容</button>
        </form>
        <div class="search-panel">
            <h2>搜尋結果</h2>
            <p id="searchStatus">請輸入單字後，按「搜尋相關內容」。</p>
            <div id="searchResults" class="words-list"></div>
        </div>
        <a href="index.html" class="back-link">返回學習頁面</a>
    </div>
    <script src="admin.js"></script>
</body>
</html>
